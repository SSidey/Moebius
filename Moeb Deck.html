tyle=\"font-size:17px;line-height:1.35;color:#9a948a;\">a tool that worked, but forced a workaround<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e8754d;\">09<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#f2efe9;\">workflow-gaps<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.35;color:#9a948a;\">the right action in the wrong phase<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e8754d;\">10<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#f2efe9;\">missed-signals<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.35;color:#9a948a;\">an anomaly that should have raised a signal<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e8754d;\">11<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#f2efe9;\">review-chain-integrity<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.35;color:#9a948a;\">clean verdicts on a visibly messy run<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(232,117,77,0.09);border:1px solid rgba(232,117,77,0.4);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:7px;justify-content:center;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#f2c3ac;\">Non-sycophancy contract<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.4;color:#e7d8cf;\">A clean verdict from prior reviewers is not evidence of a clean run — find what they missed.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 16 · EXHIBIT — ANNOTATED SIGNAL -->\n  \n\n  <!-- 16 · EXHIBIT — SELF-REVIEW OUTPUT -->\n  <section data-label=\"Exhibit — Self-review\" data-screen-label=\"17 Exhibit self-review\" data-speaker-notes=\"moeb reviewing its own runs. Eleven lenses on the execution trace, not the output. These two signals were produced by the system observing itself — no human found them. They feed straight back into the queue.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:row;align-items:center;gap:70px;box-sizing:border-box;padding:84px 96px 84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:10px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.5;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"width:540px;flex-shrink:0;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Exhibit · Self-review<\u002Fspan>\n      <h2 style=\"font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;text-wrap:balance;\">moeb reviewing itself<\u002Fh2>\n      <p style=\"font-size:26px;line-height:1.5;color:#cfcabf;margin:24px 0 0;\">Eleven lenses on the execution trace, not the output.<br>No human found these two signals — the system found them in itself, and scheduled the fixes.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:16px;\">\n        <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:8px;padding:8px 14px;\">self-review.md<\u002Fspan>\n        <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#9a948a;border-radius:8px;padding:8px 14px;\">Stage 4 · Introspection<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;max-height:858px;position:relative;border:1px solid rgba(242,239,233,0.12);border-radius:14px;background:#080706;overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid rgba(242,239,233,0.10);background:rgba(255,255,255,0.02);flex-shrink:0;\">\n        <span style=\"display:flex;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#cfcabf;margin-left:6px;\">self-review.md<\u002Fspan>\n        <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6660;\">markdown<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;overflow:hidden;\">\n        <pre style=\"margin:0;padding:22px 28px;font-family:'JetBrains Mono',monospace;font-size:14.5px;line-height:1.62;color:#a8a299;white-space:pre-wrap;overflow-wrap:anywhere;\">moeb observing itself — retrospective reviewer\neleven lenses on the trace, not the output\n\nSignal a9b0c1d2 — workflow-gaps (Major)\n  \"run file written in Phase 8 before review phases\n   collect all emittedSignals\"\n  The permanent record was written before the phases\n  that populate it had finished — rewritten twice after.\n  A skill-file ordering problem, not a code bug.\n\nSignal a6b7c8d9 — efficiency (Minor)\n  \"read_file on 63KB signals/index.md when read_file_range\n   on 4 lines would have sufficed\"\n  grep had already located line 192; the full-file read\n  produced an overflow. Refines the very fix this run added.\n\nNo human identified either of these.\nThe system found them in itself.\n\n  run -&gt; retrospective reviewer -&gt; signals\n      -&gt; fix_signal -&gt; spec -&gt; run<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 19 · ORCHESTRATION PREAMBLE -->\n  <section data-label=\"The full workflow\" data-screen-label=\"18 Workflow\" data-speaker-notes=\"Preamble to the run log. Every change runs the same pipeline: three commands, a four-stage review chain, then a candidate tag. fix_signal claims the signal and opens a branch; spec authors the specification we just saw; run implements against it and self-verifies; the review chain reads the run; a candidate tag closes it and any new signals re-enter the queue. The next slide follows one real signal — f4e3d2c1 — through this, logged minute by minute.\" style=\"background:#100d0b;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:74px 90px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:70px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.46;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">The full workflow<\u002Fspan>\n    <h2 style=\"font-size:58px;line-height:1.02;font-weight:600;letter-spacing:-0.02em;margin:14px 0 0;max-width:1320px;text-wrap:balance;\">From signal to candidate, in one pass<\u002Fh2>\n    <p style=\"font-size:26px;line-height:1.45;color:#cfcabf;margin:18px 0 0;max-width:1280px;\">Every change runs the same pipeline — three commands, a four-stage review chain, and a tag. No human in the inner loop.<\u002Fp>\n    <div style=\"display:flex;align-items:stretch;gap:12px;margin-top:36px;\">\n      <div style=\"flex:1;min-width:0;background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:21px;color:#e8754d;\">fix_signal<\u002Fdiv>\n        <div style=\"font-size:19px;line-height:1.35;color:#a8a299;\">Claims an open signal and opens a branch.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;color:#e8754d;font-size:24px;flex-shrink:0;\">→<\u002Fdiv>\n      <div style=\"flex:1;min-width:0;background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:9px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:21px;color:#e8754d;\">spec<\u002Fdiv>\n        <div style=\"font-size:19px;line-height:1.35;color:#a8a299;\">Authors the specification — the file on the last slide.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;color:#e8754d;font-size:24px;flex-shrink:0;\">→<\u002Fdiv>\n      <div style=\"flex:3.1;min-width:0;border:1px solid rgba(232,117,77,0.4);border-radius:16px;background:rgba(232,117,77,0.05);padding:13px 14px 15px;display:flex;flex-direction:column;gap:9px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;padding:0 4px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:21px;color:#e8754d;\">run<\u002Fspan><span style=\"font-size:16px;color:#8a847a;\">— implements, reviews, and tags in a single command<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:stretch;gap:10px;\">\n          <div style=\"flex:1;min-width:0;background:rgba(255,255,255,0.03);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:16px 15px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:17px;color:#e8754d;\">implement<\u002Fdiv>\n            <div style=\"font-size:16.5px;line-height:1.35;color:#a8a299;\">Applies the spec and self-verifies.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;color:#9a7a68;font-size:18px;flex-shrink:0;\">→<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;background:rgba(255,255,255,0.03);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:16px 15px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:17px;color:#e8754d;\">review chain<\u002Fdiv>\n            <div style=\"font-size:16.5px;line-height:1.35;color:#a8a299;\">Structural · behavioural · reasoning · retrospective.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;color:#9a7a68;font-size:18px;flex-shrink:0;\">→<\u002Fdiv>\n          <div style=\"flex:1;min-width:0;background:rgba(232,117,77,0.1);border:1px solid rgba(232,117,77,0.4);border-radius:12px;padding:16px 15px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:17px;color:#f2c3ac;\">candidate<\u002Fdiv>\n            <div style=\"font-size:16.5px;line-height:1.35;color:#cbb3a6;\">Tags the build; new signals re-enter the queue.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:23px;line-height:1.5;color:#8a847a;margin:42px 0 0;max-width:1300px;\"><span style=\"color: rgb(207, 202, 191); --darkreader-inline-color: var(--darkreader-text-cfcabf, #c5c0b8);\" data-darkreader-inline-color=\"\">Next:<\u002Fspan> the same pipeline on signal <span style=\"font-family: &quot;JetBrains Mono&quot;, monospace; font-size: 21px; color: rgb(242, 195, 172); --darkreader-inline-color: var(--darkreader-text-f2c3ac, #efb599);\" data-darkreader-inline-color=\"\">f4e3d2c1<\u002Fspan> — open to candidate in ~44 minutes.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 20 · EXHIBIT — ORCHESTRATION FLOW -->\n  <section data-label=\"Exhibit — Orchestration\" data-screen-label=\"19 Exhibit run-log\" data-speaker-notes=\"The end-to-end run log. fix_signal picks it up, spec authors the fix, run implements it, a completion event closes the pipeline. The implementation run was clean — zero retries. This is the whole built loop on one signal.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:row;align-items:center;gap:70px;box-sizing:border-box;padding:84px 96px 84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:10px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.5;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"width:540px;flex-shrink:0;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Exhibit · Orchestration<\u002Fspan>\n      <h2 style=\"font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;text-wrap:balance;\">One signal, open to candidate<\u002Fh2>\n      <p style=\"font-size:26px;line-height:1.5;color:#cfcabf;margin:24px 0 0;\">Three commands, three agents, ~44 minutes.<br><span style=\"font-family:'JetBrains Mono',monospace;font-size:23px;color:#cfcabf;\">fix_signal → spec → run<\u002Fspan>, then a completion event the conductor would turn into a pull request.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:16px;\">\n        <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:8px;padding:8px 14px;\">run-log.md<\u002Fspan>\n        <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#9a948a;border-radius:8px;padding:8px 14px;\">The whole built loop<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;max-height:858px;position:relative;border:1px solid rgba(242,239,233,0.12);border-radius:14px;background:#080706;overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid rgba(242,239,233,0.10);background:rgba(255,255,255,0.02);flex-shrink:0;\">\n        <span style=\"display:flex;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#cfcabf;margin-left:6px;\">run-log.md<\u002Fspan>\n        <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6660;\">log<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;overflow:hidden;\">\n        <pre style=\"margin:0;padding:22px 28px;font-family:'JetBrains Mono',monospace;font-size:14.5px;line-height:1.62;color:#a8a299;white-space:pre-wrap;overflow-wrap:anywhere;\">Signal f4e3d2c1 — open to candidate — wall time ~44 min\n\n19:00  fix_signal  02b8cfb3   picked up, branch created\n19:12  spec        665e4e92   specification authored\n19:32  run         4e5e2179   executed, QA passed\n19:44  event                  run_completed, pipeline closes\n\nPhase 1 — fix_signal (02b8cfb3)\n  status open -&gt; in_progress; branch created\n  5 steps, all iteration_count = 0\n  5 signals emitted by the retrospective reviewer\n\nPhase 2 — spec (665e4e92)\n  authored 157-line spec: 10 rubric criteria, 3 decisions,\n  4 steps, Mermaid diagram, full backlinks\n  status in_progress -&gt; spec_written\n  2 signals emitted\n\nPhase 3 — run (4e5e2179)\n  4 files modified, all iteration_count = 0\n  verify_rubrics: 10 structured + 3 qualitative PASS\n  candidate tag applied; 0 signals — clean run\n\n                 fix_signal   spec   run   total\n  steps               5         2      4     11\n  retries             0         0      0      0\n  signals             5         2      0      7<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 20 · PLANNED TERRITORY (divider) -->\n  <section data-label=\"Planned\" data-screen-label=\"20 Planned\" data-speaker-notes=\"Section turn. Everything up to this point is built and running today. The final two orbits — remote signalling and goal-driven runs — are designed but not yet shipped. Be clear about the line between what exists and what's intended.\" style=\"background:#0a0908;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:-150px;top:50%;margin-top:-330px;width:660px;height:660px;animation:spin 90s linear infinite;opacity:0.55;\">\n      <svg viewBox=\"0 0 200 200\" width=\"660\" height=\"660\">\n        <circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(150,148,138,0.32)\" stroke-width=\"0.6\" stroke-dasharray=\"3 8\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"100\" r=\"72\" fill=\"none\" stroke=\"rgba(150,148,138,0.22)\" stroke-width=\"0.6\" stroke-dasharray=\"3 8\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"100\" r=\"50\" fill=\"none\" stroke=\"rgba(242,239,233,0.08)\" stroke-width=\"0.6\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"6\" r=\"2.4\" fill=\"#e8754d\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:0.26em;text-transform:uppercase;color:#e8754d;position:relative;z-index:2;\">What's next<\u002Fspan>\n    <h2 style=\"font-size:96px;line-height:0.98;font-weight:700;letter-spacing:-0.03em;margin:24px 0 0;max-width:1240px;text-wrap:balance;position:relative;z-index:2;\">From here on, it's planned<\u002Fh2>\n    <p style=\"font-size:30px;line-height:1.45;color:#a8a299;margin:30px 0 0;max-width:1100px;position:relative;z-index:2;\"><\u002Fp>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:42px;position:relative;z-index:2;font-family:'JetBrains Mono',monospace;font-size:22px;\">\n      <span style=\"border:1px dashed rgba(232,117,77,0.5);border-radius:12px;padding:14px 22px;color:#f2c3ac;\">Orbit 05 · Remote signalling<\u002Fspan>\n      <span style=\"border:1px dashed rgba(150,148,138,0.4);border-radius:12px;padding:14px 22px;color:#cfcabf;\">Orbit 06 · Goal-driven runs<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 18 · STAGE 5 PLANNED -->\n  <section data-label=\"Stage 5 — Remote signalling\" data-screen-label=\"21 Stage 5 Planned\" data-speaker-notes=\"Planned. A deployed instance emits signals about its own behaviour — model failure rates, rubric pass rates, cost per phase — into the same queue as local QA signals. Plus a PR inspection point before merge.\" style=\"background:#0a0908;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div style=\"position:absolute;top:70px;right:90px;width:148px;height:148px;\">\n      <svg viewBox=\"0 0 148 148\" width=\"148\" height=\"148\">\n        <circle cx=\"74\" cy=\"74\" r=\"4\" fill=\"#403c36\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"14\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"24\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"34\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"44\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"56\" fill=\"none\" stroke=\"#e8754d\" stroke-width=\"2\" stroke-dasharray=\"4 7\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"18\" r=\"3.5\" fill=\"#e8754d\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"68\" fill=\"none\" stroke=\"rgba(150,148,138,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3 8\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:18px;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Stage 5 · Orbit 05<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.18em;text-transform:uppercase;color:#6b6660;border:1px solid rgba(150,148,138,0.4);border-radius:20px;padding:5px 14px;\">Planned<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:72px;line-height:1.0;font-weight:600;letter-spacing:-0.02em;margin:18px 0 0;color:#d8d3c8;\">Remote signalling<\u002Fh2>\n    <p style=\"font-size:30px;line-height:1.45;color:#a8a299;margin:24px 0 0;max-width:1180px;\">The loop extends beyond local runs — a deployed instance reports on itself, and a pull request becomes the inspection point before merge.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:46px;\">\n      <div style=\"background:rgba(255,255,255,0.02);border:1px dashed rgba(242,239,233,0.16);border-radius:16px;padding:32px 36px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#9a948a;letter-spacing:0.04em;\">REMOTE SIGNALS<\u002Fdiv>\n        <p style=\"font-size:25px;line-height:1.5;color:#a8a299;margin:16px 0 0;\">A live instance emits model failure rates, rubric pass rates, and cost per phase — feeding the same development queue as local QA.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.02);border:1px dashed rgba(242,239,233,0.16);border-radius:16px;padding:32px 36px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#9a948a;letter-spacing:0.04em;\">PR INSPECTION POINT<\u002Fdiv>\n        <p style=\"font-size:25px;line-height:1.5;color:#a8a299;margin:16px 0 0;\">A review-ready pull request becomes the human checkpoint — everything before it automated, the merge decision still owned.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 19 · STAGE 6 PLANNED -->\n  <section data-label=\"Stage 6 — Goal-driven runs\" data-screen-label=\"22 Stage 6 Planned\" data-speaker-notes=\"Planned. The conductor drives the full pipeline from signal selection to pull request, monitoring progress toward a target. The conductor is a separate project — moeb stays lean; the conductor calls it. GitHub Issues ingestion makes external intent a first-class input.\" style=\"background:#0a0908;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div style=\"position:absolute;top:70px;right:90px;width:148px;height:148px;\">\n      <svg viewBox=\"0 0 148 148\" width=\"148\" height=\"148\">\n        <circle cx=\"74\" cy=\"74\" r=\"4\" fill=\"#403c36\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"14\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"24\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"34\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"44\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"56\" fill=\"none\" stroke=\"rgba(150,148,138,0.2)\" stroke-width=\"1\" stroke-dasharray=\"3 8\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"74\" r=\"68\" fill=\"none\" stroke=\"#e8754d\" stroke-width=\"2\" stroke-dasharray=\"4 7\"><\u002Fcircle>\n        <circle cx=\"74\" cy=\"6\" r=\"3.5\" fill=\"#e8754d\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:18px;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Stage 6 · Orbit 06<\u002Fspan>\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.18em;text-transform:uppercase;color:#6b6660;border:1px solid rgba(150,148,138,0.4);border-radius:20px;padding:5px 14px;\">Planned<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:72px;line-height:1.0;font-weight:600;letter-spacing:-0.02em;margin:18px 0 0;color:#d8d3c8;\">Goal-driven runs<\u002Fh2>\n    <p style=\"font-size:30px;line-height:1.45;color:#a8a299;margin:24px 0 0;max-width:1240px;\">The conductor drives the whole pipeline — signal selection to pull request — with progressive monitoring toward a target. The human reviews and approves candidates; everything prior is automated.<\u002Fp>\n    <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:48px;font-family:'JetBrains Mono',monospace;font-size:23px;color:#cfcabf;\">\n      <span style=\"border:1px dashed rgba(242,239,233,0.2);border-radius:10px;padding:14px 20px;\">signal<\u002Fspan>\n      <span style=\"color:#e8754d;\">→<\u002Fspan>\n      <span style=\"border:1px dashed rgba(242,239,233,0.2);border-radius:10px;padding:14px 20px;\">spec<\u002Fspan>\n      <span style=\"color:#e8754d;\">→<\u002Fspan>\n      <span style=\"border:1px dashed rgba(242,239,233,0.2);border-radius:10px;padding:14px 20px;\">run<\u002Fspan>\n      <span style=\"color:#e8754d;\">→<\u002Fspan>\n      <span style=\"border:1px dashed rgba(242,239,233,0.2);border-radius:10px;padding:14px 20px;\">verify<\u002Fspan>\n      <span style=\"color:#e8754d;\">→<\u002Fspan>\n      <span style=\"border:1px solid rgba(232,117,77,0.5);border-radius:10px;padding:14px 20px;color:#f2c3ac;\">pull request<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:24px;line-height:1.5;color:#8a847a;margin:40px 0 0;max-width:1300px;\">The conductor is a separate project — Moeb stays lean; the conductor calls it.&nbsp;<br>A filed GitHub Issue becomes a signal too.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 20 · WHAT THE HUMAN STILL OWNS -->\n  <section data-label=\"What the human still owns\" data-screen-label=\"23 Human owns\" data-speaker-notes=\"Honest constraints slide. The harness owns the build loop, but the human still owns intent, the merge, and the two policies that make it trustworthy: immutability and no human-written code.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:70px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.46;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">What the human still owns<\u002Fspan>\n    <h2 style=\"font-size:62px;line-height:1.04;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;max-width:1300px;text-wrap:balance;\">The loop builds the code. The human sets the terms.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:46px;\">\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:16px;padding:34px 38px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#e8754d;letter-spacing:0.04em;margin-bottom:22px;\">OWNED BY THE HUMAN<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px;\">\n          <div style=\"font-size:26px;line-height:1.4;color:#d8d3c8;\"><span style=\"color:#f2efe9;font-weight:500;\">Intent<\u002Fspan> — the raw requirement that starts a run.<\u002Fdiv>\n          <div style=\"font-size:26px;line-height:1.4;color:#d8d3c8;\"><span style=\"color:#f2efe9;font-weight:500;\">The merge<\u002Fspan> — review and accept, or decline.<\u002Fdiv>\n          <div style=\"font-size:26px;line-height:1.4;color:#d8d3c8;\"><span style=\"color:#f2efe9;font-weight:500;\">Judgment<\u002Fspan> — wherever the specification leaves room.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:16px;padding:34px 38px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#e8754d;letter-spacing:0.04em;margin-bottom:22px;\">THE TWO POLICIES THAT HOLD<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px;\">\n          <div style=\"font-size:26px;line-height:1.4;color:#d8d3c8;\"><span style=\"color:#f2efe9;font-weight:500;\">Immutability<\u002Fspan> — specs are never edited; a new one supersedes with a backlink. The harness is the audit trail.<\u002Fdiv>\n          <div style=\"font-size:26px;line-height:1.4;color:#d8d3c8;\"><span style=\"color:#f2efe9;font-weight:500;\">No human-written code<\u002Fspan> — every file, including CI and schema, is produced by the harness. Harder to hold than it sounds.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 21 · OURO & ARIADNE -->\n  <section data-label=\"Ouro &amp; Ariadne\" data-screen-label=\"24 Platform\" data-speaker-notes=\"Ariadne: moeb applied to an unfamiliar codebase — a model router. It surfaced five signals about moeb itself, which became the queue for making moeb client-project ready. Ouro / the conductor: the autonomous layer that calls moeb. The point: moeb is a platform, not just a tool.\" style=\"background:#100d0b;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:70px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.46;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Ouro &amp; Ariadne<\u002Fspan>\n    <h2 style=\"font-size:62px;line-height:1.04;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;max-width:1320px;text-wrap:balance;\">Moeb as a platform, not just a tool<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:46px;\">\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:16px;padding:34px 38px;\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;\"><span style=\"font-size:30px;font-weight:600;color:#f2efe9;\">Ariadne<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:17px;color:#8a847a;\">moeb running against an existing codebase<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:25px;line-height:1.5;color:#d8d3c8;margin:18px 0 0;\">A model router built by applying moeb to an unfamiliar project. It cleared a broken implementation and rebuilt it — and surfaced five signals about <em style=\"font-style:normal;color:#f2efe9;\">moeb itself<\u002Fem>.<\u002Fp>\n        <p style=\"font-size:23px;line-height:1.5;color:#9a948a;margin:16px 0 0;\">Those five started a focused queue for making moeb client-project ready.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:16px;padding:34px 38px;\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;\"><span style=\"font-size:30px;font-weight:600;color:#f2efe9;\">Ouro<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:17px;color:#8a847a;\">the conductor<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:25px;line-height:1.5;color:#d8d3c8;margin:18px 0 0;\">The autonomous layer: an event driven state machine&nbsp; that drives the pipeline end to end.<\u002Fp>\n        <p style=\"font-size:23px;line-height:1.5;color:#9a948a;margin:16px 0 0;\">It is a separate project by design. Moeb stays lean and composable; the conductor calls it. The harness became a platform others build on.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 22 · OPEN QUESTIONS -->\n  <section data-label=\"Any questions\" data-screen-label=\"25 Any questions\" data-speaker-notes=\"Close and open the floor. Don't prompt — let the audience bring their own questions.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div style=\"position:absolute;right:-120px;bottom:-120px;width:560px;height:560px;animation:spin 80s linear infinite;opacity:0.4;\">\n      <svg viewBox=\"0 0 200 200\" width=\"560\" height=\"560\">\n        <circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.5\" stroke-dasharray=\"2 8\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"100\" r=\"64\" fill=\"none\" stroke=\"rgba(242,239,233,0.07)\" stroke-width=\"0.5\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:0.26em;text-transform:uppercase;color:#e8754d;\">Thank you<\u002Fspan>\n    <h2 style=\"font-size:120px;line-height:0.98;font-weight:700;letter-spacing:-0.03em;margin:26px 0 0;\">Any questions?<\u002Fh2>\n    <div style=\"margin-top:40px;display:flex;gap:24px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:20px;color:#8a847a;position:relative;z-index:2;\">\n      <span style=\"color:#e8754d;\">moeb<\u002Fspan>\n      <span style=\"color:#403c36;\">/<\u002Fspan>\n      <span>github.com/SSidey/moebius<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
