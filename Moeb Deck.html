 U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4b8a027b-538a-4436-8b74-dfa8582fea60\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"abd79214-8213-495f-b57d-b394b33191f6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"678929da-2387-45ec-b130-03bf6536984d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"b3b733c7-91a3-4ee4-9395-18db2d1e16fd\"><\u002Fscript>\n<style>\n  html,body{margin:0;padding:0;background:#0c0b0a;}\n  *{box-sizing:border-box;}\n  @keyframes spin{to{transform:rotate(360deg);}}\n  @keyframes spinrev{to{transform:rotate(-360deg);}}\n  @media (prefers-reduced-motion: reduce){*{animation:none !important;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n  <!-- 1 · COVER -->\n  <section data-label=\"Cover\" data-screen-label=\"01 Cover\" data-speaker-notes=\"The whole talk in one line: a development harness that builds, reviews, and verifies its own code. Möbius strip namesake — the loop that feeds itself.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div style=\"position:absolute;right:-200px;top:50%;margin-top:-380px;width:760px;height:760px;animation:spin 70s linear infinite;opacity:0.95;\">\n      <svg viewBox=\"0 0 200 200\" width=\"760\" height=\"760\">\n        <circle cx=\"100\" cy=\"100\" r=\"96\" fill=\"none\" stroke=\"#e8754d\" stroke-width=\"0.5\" stroke-dasharray=\"3 7\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"100\" r=\"78\" fill=\"none\" stroke=\"rgba(242,239,233,0.12)\" stroke-width=\"0.5\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"100\" r=\"58\" fill=\"none\" stroke=\"rgba(242,239,233,0.07)\" stroke-width=\"0.5\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"4\" r=\"2.6\" fill=\"#e8754d\"><\u002Fcircle>\n        <circle cx=\"178\" cy=\"100\" r=\"1.6\" fill=\"#e8754d\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"position:relative;z-index:2;max-width:1200px;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:0.26em;text-transform:uppercase;color:#e8754d;\">Moeb · A self-hosting AI harness<\u002Fspan>\n      <h1 style=\"font-size:106px;line-height:1.0;font-weight:700;letter-spacing:-0.03em;margin:30px 0 0;text-wrap:balance;\">Building the harness that builds itself<\u002Fh1>\n      <p style=\"font-size:34px;line-height:1.45;color:#cfcabf;margin:36px 0 0;max-width:1000px;\">A development harness that specifies, builds, reviews, and verifies its own code — bootstrapped from a README and a schema.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:absolute;left:110px;bottom:64px;display:flex;gap:26px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:18px;color:#8a847a;\">\n      <span>The Moebius Strip<\u002Fspan>\n      <span style=\"color:#403c36;\">/<\u002Fspan>\n      <span>github.com/SSidey/moebius<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · ORIGIN -->\n  <section data-label=\"Origin\" data-screen-label=\"02 Origin\" data-speaker-notes=\"Wanting to get ahead of where AI dev was heading; the thread led to harnesses and spec-driven development. Define both plainly, then state the combined loop.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:70px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.46;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Origin<\u002Fspan>\n    <h2 style=\"font-size:62px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;max-width:1320px;text-wrap:balance;\">Getting ahead of AI development led to two ideas<\u002Fh2>\n    <p style=\"font-size:29px;line-height:1.5;color:#cfcabf;margin:24px 0 0;max-width:1240px;\">Following a thread pointed towards&nbsp;<em style=\"font-style: normal; color: rgb(242, 239, 233); --darkreader-inline-color: var(--darkreader-text-f2efe9, #e3dcd0);\" data-darkreader-inline-color=\"\">AI harness<\u002Fem>, and from there to <em style=\"font-style: normal; color: rgb(242, 239, 233); --darkreader-inline-color: var(--darkreader-text-f2efe9, #e3dcd0);\" data-darkreader-inline-color=\"\">specification-driven development<\u002Fem>.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:46px;\">\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:16px;padding:34px 36px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#e8754d;letter-spacing:0.04em;\">AI Harness<\u002Fdiv>\n        <p style=\"font-size:27px;line-height:1.5;color:#d8d3c8;margin:16px 0 0;\">A framework that runs, manages, evaluates, and coordinates AI models within a larger system.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:16px;padding:34px 36px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#e8754d;letter-spacing:0.04em;\">Specification-Driven Development<\u002Fdiv>\n        <p style=\"font-size:27px;line-height:1.5;color:#d8d3c8;margin:16px 0 0;\">The formal spec of system behaviour becomes the primary source of truth for building, testing, and validating software.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:27px;line-height:1.5;color:#8a847a;margin:40px 0 0;max-width:1320px;\"><span style=\"color:#f2efe9;\">Put together:<\u002Fspan> agents write specs in an AI-first format; runner agents execute them against a harness that holds.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 3 · THE INSIGHT -->\n  <section data-label=\"The insight\" data-screen-label=\"03 The insight\" data-speaker-notes=\"This is the pause. Ask the question and let it sit. Don't rush to the answer.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;box-sizing:border-box;padding:84px 130px;overflow:hidden;\">\n    <div style=\"position:absolute;right:120px;top:50%;margin-top:-230px;width:460px;height:460px;animation:spinrev 90s linear infinite;opacity:0.5;\">\n      <svg viewBox=\"0 0 200 200\" width=\"460\" height=\"460\">\n        <circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(242,239,233,0.10)\" stroke-width=\"0.5\" stroke-dasharray=\"2 8\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"100\" r=\"60\" fill=\"none\" stroke=\"rgba(242,239,233,0.08)\" stroke-width=\"0.5\"><\u002Fcircle>\n        <circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:0.26em;text-transform:uppercase;color:#e8754d;\">The insight<\u002Fspan>\n    <div style=\"display:flex;flex-direction:column;margin-top:36px;max-width:1340px;position:relative;z-index:2;\">\n      <div style=\"font-size:31px;line-height:1.35;color:#8a847a;\">A harnessed agent can build software from a specification.<\u002Fdiv>\n      <div style=\"width:1px;height:30px;background:rgba(232,117,77,0.45);margin:13px 0 13px 5px;\"><\u002Fdiv>\n      <div style=\"font-size:42px;line-height:1.3;font-weight:500;color:#cfcabf;max-width:1180px;\">So what's the minimum required to produce the harness itself?<\u002Fdiv>\n      <div style=\"width:1px;height:30px;background:rgba(232,117,77,0.45);margin:13px 0 13px 5px;\"><\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:25px;color:#e8a07d;letter-spacing:0.02em;\">How does something come from nothing?<\u002Fdiv>\n      <div style=\"width:1px;height:34px;background:linear-gradient(to bottom,rgba(232,117,77,0.45),#e8754d);margin:13px 0 18px 5px;\"><\u002Fdiv>\n      <h2 style=\"font-size:72px;line-height:1.04;font-weight:700;letter-spacing:-0.02em;margin:0;color:#f2efe9;max-width:1180px;text-wrap:balance;\">Can a harness build itself?<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · THE ANSWER -->\n  <section data-label=\"The answer\" data-screen-label=\"04 The answer\" data-speaker-notes=\"The question this answers, stated as a yes/no: can a harness build itself? Yes. The first self-host: a GitHub Actions spec that produced moeb's own release binary. From then on, moeb's pipeline was a spec like any other change.\" style=\"background:#100d0b;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:row;align-items:center;gap:80px;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div style=\"flex:1;min-width:0;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:0.26em;text-transform:uppercase;color:#e8754d;\">The answer<\u002Fspan>\n      <p style=\"font-family:'JetBrains Mono',monospace;font-size:27px;color:#9a948a;margin:16px 0 0;letter-spacing:0.02em;\">Can a harness build itself?<\u002Fp>\n      <h2 style=\"font-size:128px;line-height:0.95;font-weight:700;letter-spacing:-0.03em;margin:14px 0 0;\">Yes.<\u002Fh2>\n      <p style=\"font-size:46px;line-height:1.15;font-weight:500;color:#f2efe9;margin:30px 0 0;max-width:760px;text-wrap:balance;\">Moeb harnesses Moeb.<\u002Fp>\n      <p style=\"font-size:27px;line-height:1.5;color:#9a948a;margin:34px 0 0;max-width:720px;\">The first self-host was a spec that built moeb's own release pipeline. After that, every change to moeb was just another specification.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex-shrink:0;width:520px;height:520px;position:relative;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"position:absolute;inset:0;animation:spin 32s linear infinite;\">\n        <svg viewBox=\"0 0 200 200\" width=\"520\" height=\"520\">\n          <circle cx=\"100\" cy=\"100\" r=\"84\" fill=\"none\" stroke=\"#e8754d\" stroke-width=\"1\" stroke-dasharray=\"160 60\" stroke-linecap=\"round\"><\u002Fcircle>\n          <polygon points=\"184,100 174,94 174,106\" fill=\"#e8754d\"><\u002Fpolygon>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"position:absolute;top:18px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:22px;color:#f2efe9;background:#100d0b;padding:0 12px;\">spec<\u002Fdiv>\n      <div style=\"position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:22px;color:#f2efe9;background:#100d0b;padding:0 12px;\">run<\u002Fdiv>\n      <div style=\"text-align:center;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:0.18em;color:#8a847a;text-transform:uppercase;\">the loop<\u002Fdiv>\n        <div style=\"font-size:40px;font-weight:600;color:#e8754d;margin-top:6px;\">moeb<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5 · GRAVITY WELL -->\n  \n\n  <!-- 6 · MINIMUM VIABLE ENTRY -->\n  <section data-label=\"Minimum viable entry\" data-screen-label=\"05 Minimum viable entry\" data-speaker-notes=\"An AI interviewed me for requirements, produced base-harness.md, which produced the baseline project. The minimum viable entry is genuinely minimal — four things.\" style=\"background:#100d0b;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;padding:84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:70px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.46;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:0.26em;text-transform:uppercase;color:#e8754d;\">Minimum viable entry<\u002Fspan>\n    <h2 style=\"font-size:74px;line-height:1.04;font-weight:600;letter-spacing:-0.02em;margin:26px 0 0;max-width:1300px;text-wrap:balance;\">Everything came from a README and a schema<\u002Fh2>\n    <div style=\"display:flex;gap:18px;flex-wrap:wrap;margin-top:46px;font-family:'JetBrains Mono',monospace;font-size:26px;\">\n      <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:10px;padding:14px 22px;\">README.md<\u002Fspan>\n      <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:10px;padding:14px 22px;\">spec-schema.yaml<\u002Fspan>\n      <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#cfcabf;border-radius:10px;padding:14px 22px;\">harness/<\u002Fspan>\n      <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#cfcabf;border-radius:10px;padding:14px 22px;\">src/<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:28px;line-height:1.55;color:#9a948a;margin:46px 0 0;max-width:1180px;\">An AI interviewed me for requirements → those produced <span style=\"font-family:'JetBrains Mono',monospace;color:#cfcabf;font-size:25px;\">base-harness.md<\u002Fspan> → which produced the baseline project. The first loop closed there: enough to generate every change that followed.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 7 · EXHIBIT — MINIMUM VIABLE ENTRY -->\n  <section data-label=\"Exhibit — Entry point\" data-screen-label=\"06 Exhibit README + schema\" data-speaker-notes=\"The two files moeb init writes. README gives the agent its four policies; the schema gives it the output format. Everything else is built on top of these.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:row;align-items:center;gap:70px;box-sizing:border-box;padding:84px 96px 84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:10px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.5;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"width:540px;flex-shrink:0;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Exhibit · The entry point<\u002Fspan>\n      <h2 style=\"font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;text-wrap:balance;\">Everything bootstraps from two files<\u002Fh2>\n      <p style=\"font-size:26px;line-height:1.5;color:#cfcabf;margin:24px 0 0;\">The README gives an agent its four policies; the schema gives it the output format.<br><span style=\"font-family:'JetBrains Mono',monospace;font-size:23px;color:#cfcabf;\">moeb init<\u002Fspan> writes exactly this — nothing more.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:16px;\">\n        <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:8px;padding:8px 14px;\">.moeb/README.md<\u002Fspan>\n        <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#9a948a;border-radius:8px;padding:8px 14px;\">The entry point<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;max-height:858px;position:relative;border:1px solid rgba(242,239,233,0.12);border-radius:14px;background:#080706;overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid rgba(242,239,233,0.10);background:rgba(255,255,255,0.02);flex-shrink:0;\">\n        <span style=\"display:flex;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#cfcabf;margin-left:6px;\">.moeb/README.md<\u002Fspan>\n        <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6660;\">markdown<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;overflow:hidden;\">\n        <pre style=\"margin:0;padding:22px 28px;font-family:'JetBrains Mono',monospace;font-size:14.5px;line-height:1.62;color:#a8a299;white-space:pre-wrap;overflow-wrap:anywhere;\"># Declarative Harness\n\nA declarative specification harness: a consistent, structured\nrecord of the requirements and decisions that govern every\nchange to the solution layer.\n\n## Policies\n\nNo drift.            A spec stays consistent with its parents\n                     and the decisions they record.\nNo modification.     Specs are immutable; a new spec\n                     supersedes the old, with a backlink.\nContradictions stop. A conflicting spec halts the run until\n                     a human resolves it.\nStatus discipline.   Every spec is active, superseded, or draft.\n\n# spec-schema.yaml\nspec:\n  title: string\n  domain: string\n  status: string        # active | superseded | draft\n  signal_id: string     # links spec to its signal\n  raw_requirement: string\n  diagram: required      # Mermaid; mandatory\n  steps:        [ ... ]\n  decisions:    [ ... ]\n  rubric:\n    structured:  [ ... ]\n    qualitative: [ ... ]<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 · EXHIBIT — SPEC COMPLEXITY GROWTH -->\n  <section data-label=\"Exhibit — Evolution\" data-screen-label=\"07 Exhibit spec-growth\" data-speaker-notes=\"How the schema grew. The first spec was four fields. Today's is a structured artefact with machine-verifiable criteria, signal lineage, a diagram, decisions with rejected alternatives. Each addition closed a gap a signal recorded — the harness governing itself.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:row;align-items:center;gap:70px;box-sizing:border-box;padding:84px 96px 84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:10px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.5;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"width:540px;flex-shrink:0;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Exhibit · Evolution<\u002Fspan>\n      <h2 style=\"font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;text-wrap:balance;\">The schema grew by governing itself<\u002Fh2>\n      <p style=\"font-size:26px;line-height:1.5;color:#cfcabf;margin:24px 0 0;\">From four fields to a structured artefact with machine-verifiable criteria.<br>Each addition closed a gap a signal recorded — accumulated precision, not overhead.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:16px;\">\n        <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:8px;padding:8px 14px;\">spec-complexity-growth.md<\u002Fspan>\n        <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#9a948a;border-radius:8px;padding:8px 14px;\">From the base harness on<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;max-height:858px;position:relative;border:1px solid rgba(242,239,233,0.12);border-radius:14px;background:#080706;overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid rgba(242,239,233,0.10);background:rgba(255,255,255,0.02);flex-shrink:0;\">\n        <span style=\"display:flex;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#cfcabf;margin-left:6px;\">spec-complexity-growth.md<\u002Fspan>\n        <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6660;\">markdown<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;overflow:hidden;\">\n        <pre style=\"margin:0;padding:22px 28px;font-family:'JetBrains Mono',monospace;font-size:14.5px;line-height:1.62;color:#a8a299;white-space:pre-wrap;overflow-wrap:anywhere;\">Specification complexity growth\nharness.base-harness.md  -&gt;  retrospective-reviewer...md\n\nFirst spec (May 2026)\n  fields:    title, domain, raw_requirement, description,\n             backlinks (parents), steps, decisions,\n             rubric (qualitative only)\n  rubric:    3 qualitative, no pass conditions\n  steps:     4    decisions: 2    diagram: absent\n  signal linkage: none    status field: absent\n\nRecent spec (June 2026)\n  fields:    + status, signal_id, diagram (Mermaid),\n             backlinks x3, decisions x3 w/ alternatives\n  rubric:    10 structured (2 kernel-authoritative) +\n             3 qualitative, each with phase + pass_condition\n  steps:     4, each with parity rationale\n\nWhat changed, and why\n  Mermaid diagram required   visual anchor for agents\n  status field               machine-readable lifecycle\n  signal_id linkage          trace spec -&gt; its signal\n  structured rubric phase    deterministic vs judgment\n  all-skill-files-parity     stop skill-file divergence\n\nAccumulated precision, not overhead — each field closed\na gap that a signal recorded.<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection><section data-label=\"The gravity well\" data-screen-label=\"08 The gravity well\" data-speaker-notes=\"Human at the centre. Each distancing stage is one orbit further out — more autonomy, less human involvement. Expensive to reach the early orbits; the distance compounds once you're there. Solid orbits are built; dashed orbits are planned. Note the built order: Creation, Repeatability, Verification, then Introspection.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:74px 90px;overflow:hidden;\">\n    <div style=\"position:relative;z-index:3;max-width:760px;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">The gravity well<\u002Fspan>\n      <h2 style=\"font-size:56px;line-height:1.06;font-weight:600;letter-spacing:-0.015em;margin:16px 0 0;text-wrap:balance;\">Each stage is one orbit further out<\u002Fh2>\n      <p style=\"font-size:26px;line-height:1.5;color:#9a948a;margin:20px 0 0;max-width:620px;\">More distance means more autonomy and less human involvement. Expensive to reach early — compounding once you are there.<\u002Fp>\n      <div style=\"display:flex;gap:28px;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:16px;color:#8a847a;\">\n        <span style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:24px;height:0;border-top:2px solid #e8754d;\"><\u002Fspan>Built<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:24px;height:0;border-top:2px dashed #6b6660;\"><\u002Fspan>Planned<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <svg viewBox=\"0 0 1920 920\" width=\"1920\" style=\"position:absolute;left:0;top:90px;height:920px;z-index:1;overflow:visible;\">\n      <circle cx=\"1180\" cy=\"540\" r=\"70\" fill=\"none\" stroke=\"rgba(232,117,77,0.55)\" stroke-width=\"1.5\"><\u002Fcircle>\n      <circle cx=\"1180\" cy=\"540\" r=\"140\" fill=\"none\" stroke=\"rgba(232,117,77,0.42)\" stroke-width=\"1.5\"><\u002Fcircle>\n      <circle cx=\"1180\" cy=\"540\" r=\"210\" fill=\"none\" stroke=\"rgba(232,117,77,0.32)\" stroke-width=\"1.5\"><\u002Fcircle>\n      <circle cx=\"1180\" cy=\"540\" r=\"280\" fill=\"none\" stroke=\"rgba(232,117,77,0.24)\" stroke-width=\"1.5\"><\u002Fcircle>\n      <circle cx=\"1180\" cy=\"540\" r=\"350\" fill=\"none\" stroke=\"rgba(150,148,138,0.34)\" stroke-width=\"1.5\" stroke-dasharray=\"3 9\"><\u002Fcircle>\n      <circle cx=\"1180\" cy=\"540\" r=\"410\" fill=\"none\" stroke=\"rgba(150,148,138,0.26)\" stroke-width=\"1.5\" stroke-dasharray=\"3 9\"><\u002Fcircle>\n      <!-- human centre -->\n      <circle cx=\"1180\" cy=\"540\" r=\"9\" fill=\"#f2efe9\"><\u002Fcircle>\n      <circle cx=\"1180\" cy=\"540\" r=\"17\" fill=\"none\" stroke=\"rgba(242,239,233,0.4)\" stroke-width=\"1\"><\u002Fcircle>\n      <text x=\"1180\" y=\"583\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',monospace\" font-size=\"16\" letter-spacing=\"2\" fill=\"#8a847a\">HUMAN<\u002Ftext>\n      <!-- nodes -->\n      <circle cx=\"1180\" cy=\"470\" r=\"6\" fill=\"#e8754d\"><\u002Fcircle>\n      <text x=\"1180\" y=\"446\" text-anchor=\"middle\" font-family=\"'Space Grotesk',sans-serif\" font-size=\"22\" font-weight=\"600\" fill=\"#f2efe9\">1 · Creation<\u002Ftext>\n      <circle cx=\"1313\" cy=\"497\" r=\"6\" fill=\"#e8754d\"><\u002Fcircle>\n      <text x=\"1335\" y=\"503\" text-anchor=\"start\" font-family=\"'Space Grotesk',sans-serif\" font-size=\"22\" font-weight=\"600\" fill=\"#f2efe9\">2 · Execution shift<\u002Ftext>\n      <circle cx=\"1303\" cy=\"710\" r=\"6\" fill=\"#e8754d\"><\u002Fcircle>\n      <text x=\"1325\" y=\"716\" text-anchor=\"start\" font-family=\"'Space Grotesk',sans-serif\" font-size=\"22\" font-weight=\"600\" fill=\"#f2efe9\">3 · Verification<\u002Ftext>\n      <circle cx=\"1015\" cy=\"767\" r=\"6\" fill=\"#e8754d\"><\u002Fcircle>\n      <text x=\"995\" y=\"800\" text-anchor=\"end\" font-family=\"'Space Grotesk',sans-serif\" font-size=\"22\" font-weight=\"600\" fill=\"#f2efe9\">4 · Introspection<\u002Ftext>\n      <circle cx=\"847\" cy=\"432\" r=\"6\" fill=\"none\" stroke=\"#9a948a\" stroke-width=\"1.5\"><\u002Fcircle>\n      <text x=\"825\" y=\"438\" text-anchor=\"end\" font-family=\"'Space Grotesk',sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#9a948a\">5 · Remote signalling<\u002Ftext>\n      <circle cx=\"1040\" cy=\"155\" r=\"6\" fill=\"none\" stroke=\"#9a948a\" stroke-width=\"1.5\"><\u002Fcircle>\n      <text x=\"1040\" y=\"138\" text-anchor=\"middle\" font-family=\"'Space Grotesk',sans-serif\" font-size=\"22\" font-weight=\"500\" fill=\"#9a948a\">6 · Goal-driven runs<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fsection>\n\n  <!-- 9 · STAGE 1 CREATION -->\n  <section data-label=\"Stage 1 — Creation\" data-screen-label=\"09 Stage 1 Creation\" data-speaker-notes=\"A Rust CLI kernel. init scaffolds .moeb/, spec drives an agent to write a structured specification, run drives a separate agent to implement it. The split lets you validate the spec before committing to execution.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div style=\"position:absolute;top:74px;right:96px;width:130px;height:130px;\">\n      <svg viewBox=\"0 0 130 130\" width=\"130\" height=\"130\">\n        <circle cx=\"65\" cy=\"65\" r=\"4\" fill=\"#5c5750\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"16\" fill=\"none\" stroke=\"#e8754d\" stroke-width=\"2.5\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"49\" r=\"3.5\" fill=\"#e8754d\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"30\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"44\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"58\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Stage 1 · Orbit 01<\u002Fspan>\n    <h2 style=\"font-size:72px;line-height:1.0;font-weight:600;letter-spacing:-0.02em;margin:14px 0 0;\">Creation<\u002Fh2>\n    <p style=\"font-size:30px;line-height:1.45;color:#cfcabf;margin:22px 0 0;max-width:1180px;\">A Rust kernel turns a raw requirement into a specification, then into real code — producing moeb's first genuine artefacts.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px;\">\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:30px 30px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#e8754d;\">moeb init<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.45;color:#a8a299;margin:14px 0 0;\">Scaffolds the baseline <span style=\"font-family:'JetBrains Mono',monospace;font-size:21px;\">.moeb/<\u002Fspan> structure at the repo root.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:30px 30px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#e8754d;\">moeb spec<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.45;color:#a8a299;margin:14px 0 0;\">An agent turns a requirement into a structured spec: objective, plan, decisions, rubrics.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:30px 30px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#e8754d;\">moeb run<\u002Fdiv>\n        <p style=\"font-size:23px;line-height:1.45;color:#a8a299;margin:14px 0 0;\">A separate agent implements the spec with file tools until the task is done.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:24px;line-height:1.5;color:#8a847a;margin:36px 0 0;max-width:1300px;\">Splitting <span style=\"font-family:'JetBrains Mono',monospace;font-size:22px;color:#cfcabf;\">spec<\u002Fspan> from <span style=\"font-family:'JetBrains Mono',monospace;font-size:22px;color:#cfcabf;\">run<\u002Fspan> lets specialised models handle each, and the specification can be validated before execution begins.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 10 · EXHIBIT — MOEB-ON-MOEB DIFF -->\n  <section data-label=\"Exhibit — Specification\" data-screen-label=\"10 Exhibit specification\" data-speaker-notes=\"What moeb produces before any code: the specification for signal f4e3d2c1. Frontmatter links the spec to its signal; the raw requirement states the problem; a Mermaid diagram maps the change across the three skill files; steps each carry a parity rationale; decisions record their rejected alternatives; the rubric makes acceptance machine-checkable. This is the source of truth a run implements against.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:row;align-items:center;gap:70px;box-sizing:border-box;padding:84px 96px 84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:10px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.5;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"width:540px;flex-shrink:0;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Exhibit · The specification<\u002Fspan>\n      <h2 style=\"font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;text-wrap:balance;\">What a specification looks like<\u002Fh2>\n      <p style=\"font-size:26px;line-height:1.5;color:#cfcabf;margin:24px 0 0;\">Before any code, moeb authors a specification — frontmatter, a raw requirement, diagram, ordered steps, justified decisions, and a machine-checkable rubric.<br>This is the spec for signal <span style=\"font-family: &quot;JetBrains Mono&quot;, monospace; font-size: 23px; color: rgb(242, 195, 172); --darkreader-inline-color: var(--darkreader-text-f2c3ac, #efb599);\" data-darkreader-inline-color=\"\">f4e3d2c1<\u002Fspan>.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:16px;\">\n        <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:8px;padding:8px 14px;\">specification.md<\u002Fspan>\n        <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#9a948a;border-radius:8px;padding:8px 14px;\">Stage 1 · Creation<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;max-height:858px;position:relative;border:1px solid rgba(242,239,233,0.12);border-radius:14px;background:#080706;overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid rgba(242,239,233,0.10);background:rgba(255,255,255,0.02);flex-shrink:0;\">\n        <span style=\"display:flex;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#cfcabf;margin-left:6px;\">specification_example.md<\u002Fspan>\n        <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6660;\">spec · markdown<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;overflow:hidden;\">\n        <pre style=\"margin:0;padding:22px 28px;font-family:'JetBrains Mono',monospace;font-size:14.5px;line-height:1.62;color:#a8a299;white-space:pre-wrap;overflow-wrap:anywhere;\">---\ndomain: moeb\nslug:   retrospective-reviewer-treats-iteration-count-0-as\nstatus: active\nsignal_id: f4e3d2c1-b0a9-4876-8f5e-4d3c2b1a0f9e\n---\n\n# Retrospective Reviewer: iteration_count &gt; 0\n  as an improvement signal\n\n## Raw Requirement\niteration_count = 0 is the baseline — found and applied\nthe change on the first attempt. iteration_count &gt; 0 is\nrework. A pass at acceptance_rate 1.0 with iter 1 conflates\n'eventually correct' with 'process is sound'.\n\n## Diagram                                      (mermaid)\n  SIG ──▶ L2     lens 2 · iteration_count baseline\n  SIG ──▶ PRE    pre-read discipline   ──▶ 3 skill files\n  SIG ──▶ GRE    grep line-boundary    ──▶ 3 skill files\n\n## Steps         4  · each with a parity rationale\n## Decisions     3  · each with a rejected alternative\n\n## Rubric\n  structured    tool-errors · no-drift · spec-schema-\n                compliance · all-skill-files-parity  (+6)\n  qualitative   lens-2 precision · guidance placement ·\n                textual parity<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 · STAGE 2 REPEATABILITY -->\n  <section data-label=\"Stage 2 — Execution shift\" data-screen-label=\"11 Stage 2 Execution shift\" data-speaker-notes=\"Repeatability was essentially free once the kernel existed — skills and roles already pinned every run. The real Stage 2 story is the execution shift. moeb's commands first ran as direct API calls to Claude and OpenAI: automated, but prohibitively expensive. Running the same prompts by hand through Claude Code was affordable and produced more coherent results — but manual. The dilemma: one path automated but slow and costly, the other manual but more performant. The resolution was to host moeb as an MCP server and connect through Claude Code — automated, performant, and affordable.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div style=\"position:absolute;top:74px;right:96px;width:130px;height:130px;\">\n      <svg viewBox=\"0 0 130 130\" width=\"130\" height=\"130\">\n        <circle cx=\"65\" cy=\"65\" r=\"4\" fill=\"#5c5750\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"16\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"30\" fill=\"none\" stroke=\"#e8754d\" stroke-width=\"2.5\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"35\" r=\"3.5\" fill=\"#e8754d\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"44\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"58\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Stage 2 · Orbit 02<\u002Fspan>\n    <h2 style=\"font-size:64px;line-height:1.0;font-weight:600;letter-spacing:-0.02em;margin:14px 0 0;max-width:1320px;text-wrap:balance;\">From API tokens to an MCP server<\u002Fh2>\n    <p style=\"font-size:27px;line-height:1.45;color:#cfcabf;margin:20px 0 0;max-width:1320px;\">Repeatability came with the kernel — skills and roles already pinned every run. The open question at this orbit was <em style=\"font-style:normal;color:#f2efe9;\">where moeb should actually run.<\u002Fem><\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:38px;\">\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:28px 30px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#e8754d;letter-spacing:0.04em;\">DIRECT API CALLS<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#8a847a;\">automated · costly<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.45;color:#d8d3c8;margin:16px 0 0;\">moeb drove Claude and OpenAI over the API, billed per token. Fully hands-off — and prohibitively expensive to run.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:28px 30px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:18px;color:#e8754d;letter-spacing:0.04em;\">CLAUDE CODE, BY HAND<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#8a847a;\">manual · performant<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:24px;line-height:1.45;color:#d8d3c8;margin:16px 0 0;\">The same prompts run through Claude Code were affordable and more coherent — but a human had to drive each step.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:20px;margin-top:26px;background:rgba(232,117,77,0.09);border:1px solid rgba(232,117,77,0.4);border-radius:14px;padding:24px 30px;\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#e8754d;flex-shrink:0;\">→<\u002Fspan>\n      <p style=\"font-size:25px;line-height:1.4;color:#f2efe9;margin:0;\"><span style=\"font-weight:600;\">Host moeb as an MCP server, driven through Claude Code.<\u002Fspan> <span style=\"color:#cbb3a6;\">Automated again — and as affordable and coherent as running it by hand.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 12 · STAGE 3 VERIFICATION -->\n  <section data-label=\"Stage 3 — Verification\" data-screen-label=\"12 Stage 3 Verification\" data-speaker-notes=\"A five-layer composable rubric. The agent evaluates its own output against the assembled rubric before terminating, or reports which criteria it could not satisfy. The rubric is the reviewer — no human in the inner loop. Verification comes before introspection: you check the output holds, then you examine how the run was conducted.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:84px 110px;overflow:hidden;\">\n    <div style=\"position:absolute;top:74px;right:96px;width:130px;height:130px;\">\n      <svg viewBox=\"0 0 130 130\" width=\"130\" height=\"130\">\n        <circle cx=\"65\" cy=\"65\" r=\"4\" fill=\"#5c5750\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"16\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"30\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"44\" fill=\"none\" stroke=\"#e8754d\" stroke-width=\"2.5\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"21\" r=\"3.5\" fill=\"#e8754d\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"58\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Stage 3 · Orbit 03<\u002Fspan>\n    <h2 style=\"font-size:72px;line-height:1.0;font-weight:600;letter-spacing:-0.02em;margin:14px 0 0;\">Verification<\u002Fh2>\n    <p style=\"font-size:30px;line-height:1.45;color:#cfcabf;margin:22px 0 0;max-width:1180px;\">Completed work is checked against a five-layer composable rubric, assembled to fit the change. This builds on top of the specification's rubrics.<\u002Fp>\n    <div style=\"display:flex;gap:16px;margin-top:46px;align-items:stretch;\">\n      <div style=\"flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(242,239,233,0.12);border-radius:12px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:30px;color:#e8754d;\">1<\u002Fdiv>\n        <div style=\"font-size:23px;line-height:1.3;font-weight:500;color:#f2efe9;\">Global baseline<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.35;color:#8a847a;\">Every run, everywhere<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(242,239,233,0.12);border-radius:12px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:30px;color:#e8754d;\">2<\u002Fdiv>\n        <div style=\"font-size:23px;line-height:1.3;font-weight:500;color:#f2efe9;\">Command baseline<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.35;color:#8a847a;\">All spec or run executions<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(242,239,233,0.12);border-radius:12px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:30px;color:#e8754d;\">3<\u002Fdiv>\n        <div style=\"font-size:23px;line-height:1.3;font-weight:500;color:#f2efe9;\">Project global<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.35;color:#8a847a;\">Every run in this repo<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(242,239,233,0.12);border-radius:12px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:30px;color:#e8754d;\">4<\u002Fdiv>\n        <div style=\"font-size:23px;line-height:1.3;font-weight:500;color:#f2efe9;\">Project command<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.35;color:#8a847a;\">Spec/run in this repo<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(242,239,233,0.12);border-radius:12px;padding:24px 22px;display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:30px;color:#e8754d;\">5<\u002Fdiv>\n        <div style=\"font-size:23px;line-height:1.3;font-weight:500;color:#f2efe9;\">Trait-selected<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.35;color:#8a847a;\">When a capability is in play<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:24px;line-height:1.5;color:#8a847a;margin:34px 0 0;max-width:1300px;\">The agent evaluates its own output against the assembled rubric.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- 13 · EXHIBIT — RUBRIC EVALUATION -->\n  <section data-label=\"Exhibit — Verification\" data-screen-label=\"13 Exhibit rubric\" data-speaker-notes=\"The quality gate. iteration_count = 0 is the clean baseline. The meaningful fail: the spec run fixing the pre-read problem itself triggered the pre-read problem — caught, signalled, still passed. Eventually correct is not process is sound.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:row;align-items:center;gap:70px;box-sizing:border-box;padding:84px 96px 84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:10px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.5;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"width:540px;flex-shrink:0;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Exhibit · Verification<\u002Fspan>\n      <h2 style=\"font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;text-wrap:balance;\">A pass, and a meaningful fail<\u002Fh2>\n      \n      <p style=\"font-size:26px;line-height:1.5;color:#cfcabf;margin:24px 0 0;\"><span style=\"font-family: &quot;JetBrains Mono&quot;, monospace; font-size: 23px; color: rgb(207, 202, 191); --darkreader-inline-color: var(--darkreader-text-cfcabf, #c5c0b8);\" data-darkreader-inline-color=\"\">iteration_count = 0<\u002Fspan> is the clean baseline — ‘eventually correct’ is not ‘process is sound’.<\u002Fp><div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:16px;\">\n        <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:8px;padding:8px 14px;\">rubric-evaluation.md<\u002Fspan>\n        <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#9a948a;border-radius:8px;padding:8px 14px;\">Stage 3 · Verification<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;max-height:858px;position:relative;border:1px solid rgba(242,239,233,0.12);border-radius:14px;background:#080706;overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid rgba(242,239,233,0.10);background:rgba(255,255,255,0.02);flex-shrink:0;\">\n        <span style=\"display:flex;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#cfcabf;margin-left:6px;\">rubric-evaluation.md<\u002Fspan>\n        <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6660;\">markdown<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;overflow:hidden;\">\n        <pre style=\"margin:0;padding:22px 28px;font-family:'JetBrains Mono',monospace;font-size:14.5px;line-height:1.62;color:#a8a299;white-space:pre-wrap;overflow-wrap:anywhere;\">Rubric Evaluation — pass and meaningful fail\nrun 4e5e2179 · signal f4e3d2c1\n\nStep metrics (passing run)\n  Step 1  retrospective-reviewer.role.md  iter 0  acc 1.0\n  Step 2  run.skill.md                    iter 0  acc 1.0\n  Step 3  spec.skill.md                   iter 0  acc 1.0\n  Step 4  fix_signal.skill.md             iter 0  acc 1.0\n\nStructured rubric verdict (qa_passed: true)\n  tool-errors              PASS\n  rubric-qualification     PASS\n  skill-mandatory-phases   PASS\n  moeb-tool-origin         PASS\n  no-drift                 PASS\n  spec-schema-compliance   PASS\n  branch-clean-at-exit     PASS\n  kernel-thin-and-parity   PASS\n  all-skill-files-parity   PASS\n\nA meaningful fail (spec run 665e4e92, signal f5a6b7c8)\n  patch_file on signals/index.md before read satisfied\n  scope enforcement. iteration_count = 1, acc 1.0.\n  The run still passed — but the signal feeds the queue.\n\n  eventually correct  ≠  process is sound<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14 · STAGE 4 — INTROSPECTION (the review chain) -->\n  <section data-label=\"Stage 4 — Introspection\" data-screen-label=\"14 Stage 4 Introspection\" data-speaker-notes=\"Introspection — the fourth orbit, presented as the review chain. Every run is read by a chain of reviewers before it can close. Structural and behavioural are hard gates: shape and execution correctness, decided by the kernel and by tests. Reasoning and retrospective are advisory: they never block the run, but they are the only reviewers that emit improvement signals — Skill, Tool and Reasoning Improvements — which become specifications via fix_signal and re-enter the queue. A fifth, longitudinal reviewer is planned: a summary agent feeding cross-run review at end-to-end test.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:70px 90px;overflow:hidden;isolation:isolate;\">\n    <div style=\"position:absolute;top:70px;right:90px;width:130px;height:130px;\">\n      <svg viewBox=\"0 0 130 130\" width=\"130\" height=\"130\">\n        <circle cx=\"65\" cy=\"65\" r=\"4\" fill=\"#5c5750\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"16\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"30\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"44\" fill=\"none\" stroke=\"rgba(242,239,233,0.16)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"65\" r=\"58\" fill=\"none\" stroke=\"#e8754d\" stroke-width=\"2.5\"><\u002Fcircle>\n        <circle cx=\"65\" cy=\"7\" r=\"3.5\" fill=\"#e8754d\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Stage 4 · Orbit 04<\u002Fspan>\n    <h2 style=\"font-size:56px;line-height:1.0;font-weight:600;letter-spacing:-0.02em;margin:12px 0 0;\">Introspection<\u002Fh2>\n    <p style=\"font-size:24px;line-height:1.4;color:#cfcabf;margin:14px 0 0;max-width:1300px;\">The run is read by a chain of reviewers.<br>Each will emit <em style=\"font-style: normal; color: rgb(242, 239, 233); --darkreader-inline-color: var(--darkreader-text-f2efe9, #e3dcd0);\" data-darkreader-inline-color=\"\">signals for errors or improvements<\u002Fem>, which then become specifications via fix_signal and re-enter the queue.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:26px;\">\n      <div style=\"display:flex;flex-direction:column;gap:11px;background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:24px 22px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.05em;color:#e8754d;\">STRUCTURAL<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8a847a;\">per-step<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.25;font-weight:500;color:#f2efe9;\">Is the artifact shaped right?<\u002Fdiv>\n        <div style=\"font-size:17.5px;line-height:1.4;color:#9a948a;flex:1;\">Fields, backlinks, diagram, schema path — deterministic pass/fail, decided by the kernel.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px;margin-top:2px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#f2c3ac;background:rgba(232,117,77,0.14);border:1px solid rgba(232,117,77,0.4);border-radius:20px;padding:4px 12px;\">Hard fail<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#6b6660;\">verify_rubrics<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px;background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:24px 22px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.05em;color:#e8754d;\">BEHAVIOURAL<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8a847a;\">during + after<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.25;font-weight:500;color:#f2efe9;\">Does it actually work?<\u002Fdiv>\n        <div style=\"font-size:17.5px;line-height:1.4;color:#9a948a;flex:1;\">Tests pass, CLI output is right, scope enforcement fires — evidence, not judgment.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px;margin-top:2px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#f2c3ac;background:rgba(232,117,77,0.14);border:1px solid rgba(232,117,77,0.4);border-radius:20px;padding:4px 12px;\">Hard fail<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#6b6660;\">verify_rubrics<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px;background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:14px;padding:24px 22px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.05em;color:#e8754d;\">REASONING<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8a847a;\">phase 5b<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.25;font-weight:500;color:#f2efe9;\">Was the thinking sound?<\u002Fdiv>\n        <div style=\"font-size:17.5px;line-height:1.4;color:#9a948a;flex:1;\">Reads the run's thinking blocks for consistency and motivated reasoning. Skipped if none were produced.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px;margin-top:2px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#9a948a;background:rgba(255,255,255,0.05);border:1px solid rgba(242,239,233,0.16);border-radius:20px;padding:4px 12px;\">Advisory<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#6b6660;\">ReasoningImprovement<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px;background:rgba(232,117,77,0.07);border:1px solid rgba(232,117,77,0.32);border-radius:14px;padding:24px 22px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.05em;color:#f2c3ac;\">RETROSPECTIVE<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8a847a;\">phase 5c · last<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.25;font-weight:500;color:#f2efe9;\">How was the run conducted?<\u002Fdiv>\n        <div style=\"font-size:17.5px;line-height:1.4;color:#cbb3a6;flex:1;\">Eleven lenses on the trace — retries, over-reading, out-of-order writes, improvisation.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px;margin-top:2px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#9a948a;background:rgba(255,255,255,0.05);border:1px solid rgba(242,239,233,0.16);border-radius:20px;padding:4px 12px;\">Advisory<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#6b6660;\">Skill / Tool Improvement<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:11px;background:rgba(255,255,255,0.02);border:1px dashed rgba(150,148,138,0.45);border-radius:14px;padding:24px 22px;\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:0.05em;color:#9a948a;\">LONGITUDINAL<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6660;border:1px solid rgba(150,148,138,0.4);border-radius:14px;padding:3px 9px;\">Planned<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.25;font-weight:500;color:#cfcabf;\">Across many runs?<\u002Fdiv>\n        <div style=\"font-size:17.5px;line-height:1.4;color:#8a847a;flex:1;\">A summary agent's run summaries, reviewed by a longitudinal reviewer at end-to-end test.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:9px;margin-top:2px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#9a948a;background:rgba(255,255,255,0.05);border:1px solid rgba(242,239,233,0.16);border-radius:20px;padding:4px 12px;\">Advisory<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#6b6660;\">cross-run<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;margin-top:22px;border:1px solid rgba(242,239,233,0.12);border-radius:14px;overflow:hidden;\">\n      <div style=\"flex:1;padding:22px 28px;background:rgba(255,255,255,0.02);\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.06em;color:#e8754d;\">STRUCTURAL · BEHAVIOURAL<\u002Fspan>\n        <p style=\"font-size:21px;line-height:1.4;color:#d8d3c8;margin:9px 0 0;\">Is the output correct?&nbsp;<br>Hard gates — errors here will fail a candidate, preventing the commit from being tagged as such.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1;padding:22px 28px;background:rgba(232,117,77,0.07);border-left:1px solid rgba(242,239,233,0.12);\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.06em;color:#f2c3ac;\">REASONING · RETROSPECTIVE<\u002Fspan>\n        <p style=\"font-size:21px;line-height:1.4;color:#e7d8cf;margin:9px 0 0;\">Do we trust the process as much as the output?&nbsp;<br>Advisory — they emit the improvement signals that become specs via fix_signal.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 16 · EXHIBIT — THE ELEVEN LENSES -->\n  <section data-label=\"Exhibit — The signal\" data-screen-label=\"15 Exhibit signal.jsonc\" data-speaker-notes=\"The signal itself: category, severity, recurrence, lifecycle. This is f4e3d2c1, the one we follow. Severity escalates automatically if it recurs across three or more runs.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:row;align-items:center;gap:70px;box-sizing:border-box;padding:84px 96px 84px 110px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:10px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.5;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"width:540px;flex-shrink:0;\">\n      <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Exhibit · The signal<\u002Fspan>\n      <h2 style=\"font-size:52px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:18px 0 0;text-wrap:balance;\">The unit of self-observation<\u002Fh2>\n      <p style=\"font-size:26px;line-height:1.5;color:#cfcabf;margin:24px 0 0;\">Every invocation emits these on error or identified improvement.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:16px;\">\n        <span style=\"background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:8px;padding:8px 14px;\">f4e3d2c1.signal.jsonc<\u002Fspan>\n        <span style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(242,239,233,0.14);color:#9a948a;border-radius:8px;padding:8px 14px;\">Stage 4 · Introspection<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;max-height:858px;position:relative;border:1px solid rgba(242,239,233,0.12);border-radius:14px;background:#080706;overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid rgba(242,239,233,0.10);background:rgba(255,255,255,0.02);flex-shrink:0;\">\n        <span style=\"display:flex;gap:7px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#3a3631;\"><\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#cfcabf;margin-left:6px;\">f4e3d2c1.signal.jsonc<\u002Fspan>\n        <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#6b6660;\">jsonc<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;overflow:hidden;\">\n        <pre style=\"margin:0;padding:22px 28px;font-family:'JetBrains Mono',monospace;font-size:14.5px;line-height:1.62;color:#a8a299;white-space:pre-wrap;overflow-wrap:anywhere;\">// A signal is the unit of self-observation in moeb.\n// Produced at the end of every run; escalates on recurrence.\n{\n  \"signal_id\": \"f4e3d2c1-b0a9-4876-8f5e-4d3c2b1a0f9e\",\n  \"category\": \"SkillImprovement\",\n  \"signal_source\": \"moeb\",\n  \"severity\": \"Minor\",        // escalates after 3+ recurrences\n  \"title\": \"Retrospective Reviewer treats iteration_count &gt; 0\n            as acceptable rather than an improvement signal\",\n  \"description\": \"The baseline for any step metric is\n     iteration_count = 0. Accepting iteration_count = 1 with\n     acceptance_rate = 1.0 conflates 'eventually correct'\n     with 'process is sound'.\",\n  \"proposed_resolution\": \"1. Update lens 2 of the retrospective\n     reviewer. 2. Add Pre-Read Discipline to all three skill\n     files. 3. Add grep_files Line-Boundary Limitation.\",\n  \"gating_condition\": null,\n  \"status\": \"candidate\",\n  \"occurrence_count\": 1,\n  \"first_seen\": \"2026-06-15T11:42:00Z\",\n  \"last_seen\":  \"2026-06-15T11:42:00Z\",\n  \"candidate_tag\":\n     \"v1.30.3-candidate.moeb-retrospective-reviewer-...\",\n  \"fix_branch\":\n     \"feat/moeb-retrospective-reviewer-treats-iter-count-0\"\n}<\u002Fpre>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection><section data-label=\"Exhibit — Eleven lenses\" data-screen-label=\"16 Exhibit eleven lenses\" data-speaker-notes=\"The retrospective reviewer's instrument: eleven fixed lenses applied to the execution trace, not the artifacts. At most one signal per lens. Critical is never valid here — Major means a pattern in three or more places, Minor an isolated case. The non-sycophancy contract is the point: a clean verdict from the other reviewers is not evidence of a clean run.\" style=\"background:#0c0b0a;color:#f2efe9;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;padding:66px 90px;overflow:hidden;isolation:isolate;\">\n    <div aria-hidden=\"true\" style=\"position:absolute;right:90px;top:70px;width:148px;height:148px;z-index:-1;animation:spin 95s linear infinite;opacity:0.46;\"><svg viewBox=\"0 0 200 200\" width=\"148\" height=\"148\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"none\" stroke=\"rgba(232,117,77,0.5)\" stroke-width=\"0.6\" stroke-dasharray=\"2 9\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"66\" fill=\"none\" stroke=\"rgba(242,239,233,0.1)\" stroke-width=\"0.6\"><\u002Fcircle><circle cx=\"100\" cy=\"6\" r=\"2.2\" fill=\"#e8754d\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:30px;\">\n      <div>\n        <span style=\"display:inline-block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.24em;text-transform:uppercase;color:#e8754d;\">Exhibit · The instrument<\u002Fspan>\n        <h2 style=\"font-size:50px;line-height:1.05;font-weight:600;letter-spacing:-0.015em;margin:14px 0 0;\">Eleven lenses on the run<\u002Fh2>\n        <p style=\"font-size:24px;line-height:1.45;color:#cfcabf;margin:14px 0 0;max-width:1040px;\">The retrospective reviewer reads the execution trace — not the output — through eleven fixed lenses, emitting at most one signal each.<\u002Fp>\n      <\u002Fdiv>\n      <span style=\"flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:16px;background:rgba(232,117,77,0.12);border:1px solid rgba(232,117,77,0.4);color:#f2c3ac;border-radius:8px;padding:10px 16px;\">retrospective-reviewer.role.md<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px;\">\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e8754d;\">01<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#f2efe9;\">improvisation-events<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.35;color:#9a948a;\">steps or files the spec never asked for<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e8754d;\">02<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#f2efe9;\">transient-failures<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.35;color:#9a948a;\">a tool error forced a retry · iter_count &gt; 0<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e8754d;\">03<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#f2efe9;\">behavioral-drift<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.35;color:#9a948a;\">mandatory phases out of order or skipped<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:#e8754d;\">04<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#f2efe9;\">unnecessary-work<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.35;color:#9a948a;\">redundant calls that added no information<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.025);border:1px solid rgba(242,239,233,0.10);border-radius:12px;padding:17px 20px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;\"><span style=\"font-family:'JetBrains Mono',monospace;font-s
